# ============================================================
#  Gradle 全局配置
# ============================================================

# 构建 JVM 参数：2048MB 堆足够本项目使用；UTF-8 保证中文注释/字符串不乱码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 使用 AndroidX（Compose / lifecycle / activity 都依赖它，必须为 true）
android.useAndroidX=true

# 非传递性 R 类：每个模块只生成自己的资源引用，加快编译、减少方法数
android.nonTransitiveRClass=true

# Kotlin 官方代码风格
kotlin.code.style=official

# Kotlin 编译器直接在 Gradle 进程内跑，不另起"Kotlin 守护进程"。
# 为什么：本项目走 `gradle --no-daemon` 一次性构建，Kotlin 守护进程没有复用价值，
# 却会偶发启动失败（日志里报 "The daemon has terminated unexpectedly on startup
# attempt #1" + "Exception during IR lowering"）。它会自动回退到进程内编译、
# 最终仍能构建成功，但白等一分多钟还刷一堆 e: 噪声。固定为 in-process 即可根除。
kotlin.compiler.execution.strategy=in-process

# 如需固定 JDK，可取消下面这行的注释并改成自己的 JDK 17 路径
# （已在 Android Studio 里配置 Gradle JDK 的话则无需设置）
# org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.12.7-hotspot
